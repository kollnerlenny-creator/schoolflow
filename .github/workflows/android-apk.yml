name: Build Schooly Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Schooly Live-URL (z. B. https://schooly26.vercel.app)"
        required: false
        default: "https://schooly26.vercel.app"
  push:
    branches:
      - main
      - master
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK einrichten
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            exit 1
          fi
          RUN_AS=""
          if [ ! -w "$SDK_ROOT" ]; then
            RUN_AS="sudo"
          fi
          set +o pipefail
          yes | $RUN_AS "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          set -o pipefail
          $RUN_AS "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$SDK_ROOT" > android/local.properties
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Konsistenten Debug-Keystore zwischenspeichern
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: schooly-android-debug-keystore-v1

      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ziel-URL bestimmen
        id: url
        shell: bash
        run: |
          RAW_URL="${{ inputs.app_url }}"
          if [ -z "$RAW_URL" ]; then
            RAW_URL="${{ vars.SCHOOLY_APP_URL }}"
          fi
          if [ -z "$RAW_URL" ]; then
            RAW_URL="https://schooly26.vercel.app"
          fi
          CLEAN_URL="${RAW_URL%/}"
          echo "app_url=$CLEAN_URL" >> "$GITHUB_OUTPUT"

      - name: Android APK kompilieren
        run: |
          gradle -p android assembleDebug --no-daemon -PschoolyAppUrl="${{ steps.url.outputs.app_url }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk Schooly-Android.apk

      - name: Fertige Schooly-Android.apk hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Schooly-Android-APK
          path: Schooly-Android.apk
          retention-days: 30
